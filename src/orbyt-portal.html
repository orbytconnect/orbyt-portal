<title>Orbyt Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Julius+Sans+One&display=swap">
<style>
/* Layout: brand bar with role switcher, a greeting, then tabs (Tasks / Projects, plus roster and reviews for Orbyt); detail views replace the list with a back link */
:root{
  --bg:#F6F4EA; --surface:#FFFFFF; --surface-2:#FBFAF3;
  --ink:#18314F; --ink-2:#2C4260; --muted:#5E6E83; --line:#E3DFD0;
  --primary:#18314F; --on-primary:#F6F4EA;
  --gold:#A8871F; --gold-soft:rgba(168,135,31,.12);
  --teal:#8BBEB2; --teal-text:#3F7266; --teal-soft:rgba(139,190,178,.22);
  --warn:#9B5A1E; --warn-soft:rgba(155,90,30,.10); --focus:#3F7266; --star:#18314F;
  --fc-paid:#18314F; --fc-exp:#5B7FA8; --fc-pos:#C9D6E6;
  --font-body:"Jost","Avenir Next","Futura",system-ui,sans-serif;
  --font-mark:"Julius Sans One","Jost",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1F33; --surface:#18314F; --surface-2:#142A44;
  --ink:#F6F4EA; --ink-2:#D5DAE0; --muted:#A3B0C0; --line:#2C4260;
  --primary:#F6F4EA; --on-primary:#18314F;
  --gold:#CAAC4B; --gold-soft:rgba(202,172,75,.14);
  --teal:#8BBEB2; --teal-text:#8BBEB2; --teal-soft:rgba(139,190,178,.16);
  --warn:#E0A66B; --warn-soft:rgba(224,166,107,.12); --focus:#E6F9AF; --star:#E6F9AF; color-scheme:dark;
  --fc-paid:#F6F4EA; --fc-exp:#8BA6C6; --fc-pos:#34506F;
}}
:root[data-theme="dark"]{
  --bg:#0E1F33; --surface:#18314F; --surface-2:#142A44;
  --ink:#F6F4EA; --ink-2:#D5DAE0; --muted:#A3B0C0; --line:#2C4260;
  --primary:#F6F4EA; --on-primary:#18314F;
  --gold:#CAAC4B; --gold-soft:rgba(202,172,75,.14);
  --teal:#8BBEB2; --teal-text:#8BBEB2; --teal-soft:rgba(139,190,178,.16);
  --warn:#E0A66B; --warn-soft:rgba(224,166,107,.12); --focus:#E6F9AF; --star:#E6F9AF; color-scheme:dark;
  --fc-paid:#F6F4EA; --fc-exp:#8BA6C6; --fc-pos:#34506F;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-weight:500;margin:0;text-wrap:balance}
h1{font-size:32px;line-height:1.15}
h2{font-size:20px;font-weight:400}
h3{font-size:16px;font-weight:500}
.eyebrow{font-size:11px;font-weight:300;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
.small{font-size:14px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--teal-text)}

.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-block:20px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{display:block;flex:none;line-height:0}.brand .logo img{height:30px;width:auto;display:block}
.wordmark{font-family:var(--font-mark);font-size:22px;letter-spacing:.14em}
.brand .tag{font-size:14px;color:var(--muted);border-left:1px solid var(--line);padding-left:12px}
.as{display:flex;align-items:center;gap:10px}
.as label{font-size:11px;font-weight:300;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
select,input[type=text],input[type=email],input[type=password],input[type=tel],input[type=url],input[type=number],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;min-width:0;width:100%}
.as select{width:auto;max-width:62vw}
textarea{resize:vertical;min-height:64px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--primary);background:var(--primary);color:var(--on-primary);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink-2);filter:none}
.btn.sm{padding:5px 12px}
.btn[disabled]{opacity:.45;cursor:default;filter:none}
.linkbtn{background:none;border:0;padding:0;color:var(--teal-text);font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.hello{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;padding-block:28px 18px}
.hello p{margin:6px 0 0;color:var(--ink-2);max-width:64ch}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-size:15px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.count{font-size:12px;font-weight:500;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--primary);color:var(--on-primary);display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}

/* orbyt dashboard */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
@media (max-width:960px){.dash{grid-template-columns:minmax(0,1fr)}.dside{order:-1}}
.stats{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:28px;overflow:hidden}
.stat{padding:14px 18px;border:0;border-left:1px solid var(--line);min-width:0;background:none;text-align:left;cursor:pointer;font:inherit;color:inherit}
.stat:hover{background:var(--surface-2)}
.stat[aria-pressed=true]{background:var(--surface-2);box-shadow:inset 0 -3px 0 var(--ink)}
.stat .eyebrow{display:block}
.statpanel{margin:-16px 0 28px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.statpanel .tablewrap{margin-top:2px}
.stat:first-child{border-left:0}
.stat b{display:block;font-size:28px;font-weight:500;line-height:1.1}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(odd){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}.stat:last-child:nth-child(odd){grid-column:1 / -1}}
.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;margin-bottom:12px}
.pmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pmcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--ink-2);border-radius:var(--r);padding:14px 16px;cursor:pointer;min-width:0}
.pmcard:hover{border-color:var(--ink)}
.pmcard .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pmcard .prog{margin-top:4px}
.pmfee{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-size:14px;color:var(--ink-2)}
.pmfee b{font-weight:500;color:var(--ink)}
.warntext{color:var(--warn)!important}
.ovlist{display:grid;gap:12px}
.ov{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.ovhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:start;margin-bottom:10px}
.addrbtn{background:none;border:0;padding:0;font-size:16px;font-weight:500;cursor:pointer;text-align:left;color:var(--ink);overflow-wrap:anywhere}
.addrbtn:hover{text-decoration:underline;text-underline-offset:3px}
.svc{display:grid;border-top:1px solid var(--line)}
.svcrow{display:grid;grid-template-columns:130px minmax(0,1fr) 170px;gap:4px 14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.svcrow:last-child{border-bottom:0}
.svchead span{font-size:11px;font-weight:300;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.sep{color:var(--muted);margin:0 8px}
.rfilters{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:10px}
.rsearch{grid-column:span 2}
@media (max-width:420px){.rsearch{grid-column:auto}}
.vlink{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;text-align:left}
.vlink:hover{text-decoration-color:currentColor}
.scrim{position:fixed;inset:0;background:rgba(14,31,51,.45);z-index:30}
.vcard{position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:min(600px,calc(100% - 32px));max-height:calc(100% - 48px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px;box-shadow:0 24px 60px rgba(14,31,51,.3)}
.vchead{display:flex;justify-content:space-between;gap:12px;align-items:start}
.xbtn{background:none;border:1px solid var(--line);border-radius:999px;width:36px;height:36px;font-size:22px;line-height:1;cursor:pointer;color:var(--ink);flex:none}
.clines{display:grid;gap:8px}
.cline{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.cval{font-weight:500;overflow-wrap:anywhere;user-select:all}
.vfacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;font-size:14px}
.vfacts .wide{grid-column:1 / -1}
.vfacts .eyebrow,.vrating .eyebrow{display:block;margin-bottom:2px}
.vrating{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;background:var(--surface-2);border-radius:8px;padding:12px 14px}
.vrating .big{font-size:28px;font-weight:500;line-height:1.1;color:var(--star)}
.dist{display:grid;gap:3px;font-size:12px}
.drow{display:grid;grid-template-columns:24px minmax(0,1fr) 18px;gap:8px;align-items:center}
.dbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.dbar i{display:block;height:100%;background:var(--star)}
.heart{color:var(--ink-2);font-size:13px}
.favgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.favcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;min-width:0}
.favcard .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.vrevs{display:grid;gap:8px;margin-top:6px}
.vrevs blockquote{margin:0;font-size:14px;background:var(--surface-2);border-radius:8px;padding:10px 12px}
.reqsec{padding-block:18px;border-bottom:1px solid var(--line)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 28px;border-bottom:1px solid var(--line)}
.rgrid .reqsec{border-bottom:0}
.needs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.need{font-size:14px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink-2)}
.need.mine{border-color:var(--ink);color:var(--ink);font-weight:500}
.reqsec:last-child{border-bottom:0;padding-bottom:0}
.bidsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:10px}
.bidsum .eyebrow{display:block}
.bidsum b{font-size:20px;font-weight:500}
.fcpanel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:28px;display:grid;gap:16px}
.fctiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.fctiles>div{display:grid;gap:2px;padding:10px 12px;border-radius:8px;background:var(--surface-2);min-width:0}
.fctiles b{font-size:22px;font-weight:500;line-height:1.2}
.fctiles .fctotal{background:var(--primary);color:var(--on-primary)}
.fctiles .fctotal .eyebrow,.fctiles .fctotal .small{color:var(--on-primary);opacity:.85}
@media (max-width:900px){.fctiles{grid-template-columns:repeat(2,minmax(0,1fr))}.fctiles .fctotal{grid-column:1 / -1}}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.sw.fcpaid{background:var(--fc-paid)}.sw.fcexp{background:var(--fc-exp)}.sw.fcpos{background:var(--fc-pos);outline:1px dashed var(--ink-2);outline-offset:-1px}
.fcchart{overflow-x:auto}
.fcchart svg{width:100%;min-width:480px;height:auto;display:block}
.fcgrid{stroke:var(--line);stroke-width:1}
.fcbase{stroke:var(--ink-2);stroke-width:1}
.fcax{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.fcnow{fill:var(--ink);font-weight:500}
rect.fcpaid{fill:var(--fc-paid)}rect.fcexp{fill:var(--fc-exp)}rect.fcpos{fill:var(--fc-pos);stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 2}
.rp5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:900px){.rp5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.col.done-col{opacity:.95}
.minipipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:760px){.minipipe{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ministage{display:grid;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;color:inherit;font:inherit}
.ministage:hover{border-color:var(--ink-2)}
.ministage .num{font-size:22px;font-weight:500;line-height:1.1}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
@media (max-width:640px){.board{grid-auto-flow:row;grid-auto-columns:auto}}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:10px;min-width:0}
.col.focus{border-color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
.colhead{display:flex;justify-content:space-between;gap:8px;align-items:start}
.colhead h3{font-size:15px}
.colbody{display:grid;gap:8px}
.pcard{display:grid;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;color:inherit;font:inherit;min-width:0}
.pcard:hover{border-color:var(--ink-2)}
.pcard .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pcard .strong{overflow-wrap:anywhere}
.svcchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface)}
.chip.s0{border-color:var(--warn);color:var(--warn);border-style:dashed}
.chip.s1{border-style:dashed}
.chip.s2{border-color:var(--ink-2);color:var(--ink)}
.chip.s3{border-color:var(--teal);color:var(--teal-text)}
.chip.s4{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-text)}
.chip.s5{background:var(--teal);border-color:var(--teal);color:#18314F}
.contactrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px}
.filebtn{position:relative;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.filebtn:focus-within .btn{outline:2px solid var(--focus);outline-offset:2px}
.timerbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--ink-2);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:14px}
.dotlive{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:8px}
@media (prefers-reduced-motion:no-preference){.dotlive{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}}
.cohort td,.cohort th{text-align:center}
.cohort td:first-child,.cohort th:first-child{text-align:left}
.heat{display:inline-block;min-width:46px;padding:2px 6px;border-radius:4px;background:color-mix(in srgb,var(--fc-exp) calc(var(--h)*70%),transparent);color:var(--ink)}
.logforms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.logforms .form{margin:0;align-content:start}
@media (max-width:1000px){.logforms{grid-template-columns:minmax(0,1fr)}}
.rphead{margin:6px 0 -4px;font-size:16px}
.rptiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rptile{display:grid;gap:2px;align-content:start;padding:12px 14px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
.rptile b{font-size:24px;font-weight:500;line-height:1.2}
@media (max-width:820px){.rptiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.goodtext{color:var(--teal-text)!important}
.rpcharts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:900px){.rpcharts{grid-template-columns:minmax(0,1fr)}}
.rpline{fill:none;stroke:var(--fc-paid);stroke-width:2;stroke-linejoin:round}
.rpdot{fill:var(--fc-paid);stroke:var(--surface);stroke-width:2}
.funnel{display:grid;gap:8px}
.fstep{display:grid;grid-template-columns:150px minmax(0,1fr) 40px 170px;gap:12px;align-items:center;font-size:14px}
.fbar{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.fbar i{display:block;height:100%;background:var(--fc-exp)}
@media (max-width:640px){.fstep{grid-template-columns:minmax(0,1fr) auto}.fstep .fbar{grid-column:1 / -1;grid-row:2}}
.stat.static{cursor:default}
.stat.static:hover{background:none}
.stat .small{display:block;margin-top:2px}
.invgroups{display:grid;gap:14px}
.invcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.invtotal{font-size:24px;font-weight:500}
.invactions{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.invactions .field{flex:0 1 200px}
.invcard select,.tablewrap select{width:auto;padding:5px 8px}
form.inline{display:flex;gap:6px;align-items:center}
form.inline input{width:110px;padding:6px 8px}
.finalbox{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.revstrip{background:var(--surface);border:1px solid var(--ink-2);border-radius:var(--r);padding:16px;margin-bottom:24px;display:grid;gap:12px}
.revstrip .sechead{margin:0}
.revitems{display:grid;gap:10px}
.revitem{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.revitem:first-child{border-top:0;padding-top:0}
.revitem .row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px}
.revitem .linkbtn{justify-self:start}
.quickstars{display:inline-flex;gap:2px}
.quickstars button{background:none;border:0;padding:2px;font-size:28px;line-height:1;color:var(--line);cursor:pointer}
.quickstars:hover button{color:var(--star)}
.quickstars button:hover~button{color:var(--line)}
.vnotes{display:grid;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.addnote{display:grid;gap:8px}
.addnote textarea{min-height:56px}
.addnote .btn{justify-self:start}
.vnote{border-top:1px solid var(--line);padding-top:8px;font-size:14px;display:grid;gap:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.formlist{margin:8px 0 0;display:grid;border-top:1px solid var(--line)}
.formlist>div{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:4px 14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.formlist dt{color:var(--muted)}
.formlist dd{margin:0;overflow-wrap:anywhere}
@media (max-width:520px){.formlist>div{grid-template-columns:minmax(0,1fr)}}
.candnote{font-size:14px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:6px 8px}

<script>
/* typical order of work before a listing (or a buyer move-in); lower goes first */
const SEQ={"General contractor / remodeling":1,"Plumbing":2,"Electric":2,"HVAC":2,"Handyman":3,"Painting":4,"Landscaping":5,"Pool services":5,"Window cleaning":6,"Cleaning":7,"Staging":8,"Photography":9,
  "Home inspection":0,"Junk removal":0,"Organizing":0,"Roofing":1,"Flooring":2,"Drywall":2,"Concrete":2,"Pest control":3,"Appliance repair":3,"Garage doors":3,"Fencing":5,"Tree service":5,"Pressure washing":5,
  "Gutter cleaning":6,"Solar panel cleaning":6,"Carpet cleaning":7,"Furniture rental":8,"Signage":9};
const seqOf=(p,c)=>{if(c==="Moving")return p.clientType==="Buyer"?10:0;if(SEQ[c]!==undefined)return SEQ[c];const k=Object.keys(SEQ).find(x=>x.toLowerCase()===String(c).toLowerCase());return k?SEQ[k]:5};
const capF=t=>t.charAt(0).toUpperCase()+t.slice(1);
function typicalSteps(p){const g={};for(const c of p.categories||[]){const k=seqOf(p,c);(g[k]=g[k]||[]).push(c)}return Object.keys(g).map(Number).sort((a,b)=>a-b).map(k=>g[k])}
const hasCustomOrder=p=>Array.isArray(p.workOrder)&&p.workOrder.length>0;
function seqSteps(p){
  if(!hasCustomOrder(p))return typicalSteps(p);
  const cats=p.categories||[],steps=p.workOrder.map(g=>(g||[]).filter(c=>cats.includes(c))).filter(g=>g.length),placed=new Set(steps.flat());
  for(const c of cats.filter(c=>!placed.has(c))){const r=seqOf(p,c),i=steps.findIndex(g=>Math.min(...g.map(x=>seqOf(p,x)))>r);i<0?steps.push([c]):steps.splice(i,0,[c])}
  return steps;
}
const canReorder=p=>S.canWrite&&(kind()==="orbyt"||(kind()==="agent"&&isOnProject(p,roleVal())));
function orderEditor(p){
  const d=S.orderDraft=S.orderDraft&&S.orderDraft.pid===p.id?S.orderDraft:{pid:p.id,items:seqSteps(p).flatMap(g=>g.map((c,j)=>({c,withPrev:j>0})))};
  return `<div class="ordered"><p class="small" style="margin:0 0 8px">Move services up or down. Check "Same time as above" for work that can happen alongside the step before it. Vendors on this home see the order you set.</p>
    <ol class="seq">${d.items.map((x,i)=>`<li class="orow ${x.withPrev?"joined":""}"><span class="sn num">${i===0||!x.withPrev?d.items.slice(0,i+1).filter(y=>!y.withPrev||y===d.items[0]).length:"+"}</span>
      <div class="orowin"><span class="strong">${esc(x.c)}</span>
        <span class="ordbtns">${i>0?`<label class="inlinecheck small"><input type="checkbox" id="ord-w-${i}" data-ordwith="${i}" ${x.withPrev?"checked":""}> Same time as above</label>`:""}
          <button class="btn ghost sm" type="button" data-act="ordmove" data-i="${i}" data-d="-1" ${i===0?"disabled":""} aria-label="Move ${esc(x.c)} earlier">↑</button>
          <button class="btn ghost sm" type="button" data-act="ordmove" data-i="${i}" data-d="1" ${i===d.items.length-1?"disabled":""} aria-label="Move ${esc(x.c)} later">↓</button></span></div></li>`).join("")}</ol>
    <div class="actions"><button class="btn sm" type="button" data-act="ordsave" data-id="${esc(p.id)}">Save order</button><button class="btn ghost sm" type="button" data-act="ordcancel">Cancel</button>
      ${hasCustomOrder(p)?`<button class="linkbtn" type="button" data-act="ordreset" data-id="${esc(p.id)}">Go back to the typical order</button>`:""}</div></div>`;
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
  if(a==="ordedit"){S.orderDraft=null;S.openForm="order:"+t.dataset.id;S.openTiming=t.dataset.id;render()}
  else if(a==="ordcancel"){S.orderDraft=null;S.openForm=null;render()}
  else if(a==="ordmove"&&S.orderDraft){const it=S.orderDraft.items,i=+t.dataset.i,j=i+(+t.dataset.d);if(j<0||j>=it.length)return;[it[i],it[j]]=[it[j],it[i]];it[i].withPrev=false;it[j].withPrev=false;it[0].withPrev=false;render()}
  else if(a==="ordsave"&&S.orderDraft){const g=[];for(const x of S.orderDraft.items){if(x.withPrev&&g.length)g[g.length-1].push(x.c);else g.push([x.c])}
    const pid=t.dataset.id;S.orderDraft=null;S.openForm=null;guard(()=>col("projects").doc(pid).update({workOrder:g}),"Order saved. Vendors on this home see it too.")}
  else if(a==="ordreset"){const pid=t.dataset.id;S.orderDraft=null;S.openForm=null;guard(()=>col("projects").doc(pid).update({workOrder:null}),"Back to the typical order")}});
document.addEventListener("change",e=>{const el=e.target;if(el.dataset&&el.dataset.ordwith!==undefined&&S.orderDraft){const x=S.orderDraft.items[+el.dataset.ordwith];if(x){x.withPrev=el.checked;render()}}});
document.addEventListener("toggle",e=>{const d=e.target;if(d.classList&&d.classList.contains("timingwrap")&&d.dataset.p)S.openTiming=d.open?d.dataset.p:(S.openTiming===d.dataset.p?null:S.openTiming)},true);
function timingBlock(p,mine){
  const steps=seqSteps(p);if(!steps.length)return"";const buyer=p.clientType==="Buyer",d=daysTo(p.targetDate);
  const st=c=>{if(c===mine)return"";const t=teamBid(p.id,c);if(!t)return`<span class="small">Not booked yet</span>`;

function feeBreakdown(type,x){

  const L=[`12% on the first ${money2(Math.min(x,1000))} = ${money2(0.12*Math.min(x,1000))}`];

  if(x>5000)L.push(`5% on ${money2(x-5000)} above $5,000 = ${money2(0.05*(x-5000))}`);

function fcRange(){

  if(P==="week"){a=new Date(n);a.setDate(n.getDate()-((n.getDay()+6)%7));b=new Date(a);b.setDate(a.getDate()+6)}
  else if(P==="month"){a=new Date(n.getFullYear(),n.getMonth(),1);b=new Date(n.getFullYear(),n.getMonth()+1,0)}
  else if(P==="quarter"){const q=Math.floor(n.getMonth()/3)*3;a=new Date(n.getFullYear(),q,1);b=new Date(n.getFullYear(),q+3,0)}
  else if(P==="year"){a=new Date(n.getFullYear(),0,1);b=new Date(n.getFullYear(),11,31)}
  else{a=S.fc.from?new Date(S.fc.from+"T12:00:00"):new Date(n.getFullYear(),0,1);b=S.fc.to?new Date(S.fc.to+"T12:00:00"):new Date(n.getFullYear(),11,31)}

function moneyItems(){

  for(const p of S.projects.filter(p=>!p.listed))for(const c of p.categories||[]){if(teamBid(p.id,c))continue;

    const fin=p.targetDate&&p.targetDate>today?p.targetDate:addDaysIso(new Date().toISOString(),14);

  for(const p of S.projects.filter(p=>PM_ON&&p.pm)){const team=(p.categories||[]).map(c=>teamBid(p.id,c)).filter(Boolean),quoted=team.reduce((a,b)=>a+(b.amount||0),0),fee=Math.max(500,cents(quoted*0.1)),inv=p.pmInvoice||{};

function fcBuckets(from,to){
  const days=Math.round((new Date(to)-new Date(from))/864e5)+1,B=[];
  if(days<=10){for(let i=0;i<days;i++){const d=addDaysIso(from+"T12:00:00",i);B.push({a:d,b:d,label:new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",day:"numeric"})})}}
  else if(days<=70){let a=from;while(a<=to){const b=addDaysIso(a+"T12:00:00",6);B.push({a,b:b>to?to:b,label:fmtDate(a)});a=addDaysIso(a+"T12:00:00",7)}}
  else{let d=new Date(from+"T12:00:00");d.setDate(1);while(isoDay(d)<=to){const a=isoDay(d),e=new Date(d.getFullYear(),d.getMonth()+1,0);B.push({a:a<from?from:a,b:isoDay(e)>to?to:isoDay(e),label:d.toLocaleDateString("en-US",{month:"short"})+(days>370?" "+String(d.getFullYear()).slice(2):"")});d=new Date(d.getFullYear(),d.getMonth()+1,1)}}
  return B;
}
function fcChart(items,from,to){
  const B=fcBuckets(from,to).map(k=>{const its=items.filter(i=>i.date>=k.a&&i.date<=k.b);return{...k,paid:its.filter(i=>i.stage==="paid").reduce((a,i)=>a+i.amt,0),exp:its.filter(i=>i.stage==="exp").reduce((a,i)=>a+i.amt,0),pos:its.filter(i=>i.stage==="pos").reduce((a,i)=>a+i.amt,0)}});
  const max=Math.max(...B.map(b=>b.paid+b.exp+b.pos),0);if(!max)return`<p class="small" style="margin:0">No fees collected or expected in this range yet.</p>`;
  const nice=(()=>{const m=Math.pow(10,Math.floor(Math.log10(max))),f=max/m;return(f<=1?1:f<=2?2:f<=5?5:10)*m})();
  const W=720,H=220,L=52,Rr=8,T=12,Bt=28,pw=W-L-Rr,ph=H-T-Bt,slot=pw/B.length,bw=Math.max(6,Math.min(44,slot*0.62)),y=v=>T+ph-(v/nice)*ph,today=isoDay(new Date());
  const ticks=[0,.25,.5,.75,1].map(f=>f*nice);

  B.forEach((b,i)=>{const x=L+slot*i+(slot-bw)/2;let base=0;const seg=(v,cls,name)=>{if(!v)return"";const y0=y(base),y1=y(base+v);base+=v;const h=Math.max(1,y0-y1-(base<b.paid+b.exp+b.pos?2:0));
      return `<rect x="${x}" y="${y1}" width="${bw}" height="${h}" class="${cls}" rx="${base>=b.paid+b.exp+b.pos?3:0}"><title>${b.label}: ${name} ${money2(v)}</title></rect>`};
    const cur=today>=b.a&&today<=b.b;
    g+=`<g>${seg(b.paid,"fcpaid","Collected")}${seg(b.exp,"fcexp","Expected")}${seg(b.pos,"fcpos","Possible")}</g>`;
    if(i%every===0)g+=`<text x="${x+bw/2}" y="${H-10}" text-anchor="middle" class="fcax ${cur?"fcnow":""}">${esc(b.label)}</text>`});
  return `<div class="fcchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Orbyt fees by ${B.length>12?"month":"period"}, collected, expected and possible">${g}<line x1="${L}" x2="${W-Rr}" y1="${y(0)}" y2="${y(0)}" class="fcbase"/></svg></div>`;
}

function rosterView(){

  let h=S.canWrite?(S.openForm==="vendor"?vendorForm():S.openForm==="vimport"?vendorImportPanel():`<div class="actions" style="margin-bottom:16px"><button class="btn" data-act="form" data-key="vendor">Add a vendor</button><button class="btn ghost" data-act="form" data-key="vimport">Import vendor sign-ups</button>${S.downloads?`<button class="btn ghost" data-act="form" data-key="wixexport">Export for Wix</button>`:""}</div>`):"";
  if(S.openForm==="wixexport")h+=wixExportPanel();
  h+=reviewQueue();
  if(!all.length)return h+`<div class="emptystate"><h2>No vendors yet</h2><p>Add the painters, landscapers, photographers and cleaners you trust. Everyone here should be licensed and insured, and checked before they join.</p></div>`;
  const f=S.rf,q=f.q.trim().toLowerCase();
  const vs=all.filter(v=>(!q||v.name.toLowerCase().includes(q)||(vPhone(v)+" "+vEmail(v)).toLowerCase().includes(q))&&(!f.cat||vsv(v).includes(f.cat))&&(!f.area||(v.areas||[]).includes(f.area))
    &&(!f.status||(f.status==="review"?v.approved===false:f.status==="taking"?v.available!==false&&v.approved!==false:v.available===false))&&(!f.cred||(f.cred==="yes"?v.licensed&&v.insured:!(v.licensed&&v.insured)))
    &&(!f.promo||(f.promo==="featured"?v.featured:!v.featured))&&(!f.rating||((rating(v.id)||{avg:0}).avg>=Number(f.rating)))
    &&(!f.price||(f.price==="none"?!(priceStats(v.id)||{}).tier:(priceStats(v.id)||{}).tier===f.price)));
  const on=q||f.cat||f.area||f.status||f.cred||f.promo||f.rating||f.price;
  const sel=(id,label,val,opts)=>`<label class="field"><span>${label}</span><select id="${id}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${v===val?"selected":""}>${esc(t)}</option>`).join("")}</select></label>`;
  const usedCats=CATS.filter(c=>all.some(v=>vsv(v).includes(c)));
  h+=`<div class="rfilters"><label class="field rsearch"><span>Search</span><input type="text" id="rs-q" value="${esc(f.q)}" placeholder="Name or contact"></label>
    ${sel("rs-cat","Service",f.cat,[["","All services"],...usedCats.map(c=>[c,c])])}
    ${sel("rs-area","Area",f.area,[["","All areas"],...AREAS.map(a=>[a,a])])}
    ${sel("rs-status","Status",f.status,[["","Everyone"],["taking","Taking work"],["paused","Paused"],["review","Needs review"]])}
    ${sel("rs-cred","Licensed and insured",f.cred,[["","Everyone"],["yes","Yes"],["check","Needs a check"]])}
    ${sel("rs-rating","Rating",f.rating,[["","Any rating"],["4.5","4.5 stars and up"],["4","4 stars and up"],["3","3 stars and up"]])}
    ${sel("rs-promo","Promo",f.promo,[["","Everyone"],["featured","Featured"],["none","Not featured"]])}
    ${sel("rs-price","Pricing",f.price,[["","Any pricing"],["budget","Budget-friendly"],["mid","Mid-range"],["premium","Premium"],["none","Not enough bids yet"]])}</div>
    ${f.cat?(()=>{const am=pricedBids().filter(b=>b.category===f.cat).map(b=>b.amount).sort((x,y)=>x-y);if(!am.length)return"";const h2=am.length>>1,med=am.length%2?am[h2]:(am[h2-1]+am[h2])/2;
      return `<div class="callout" style="margin:0 0 12px"><p><span class="strong">${esc(f.cat)} bids so far:</span> ${money(am[0])} to ${money(am[am.length-1])}, typically ${money(med)}, across ${new Set(pricedBids().filter(b=>b.category===f.cat).map(b=>b.projectId)).size} projects.</p><p class="small">Job sizes vary, so the pricing tiers below compare each vendor to the other bids on the same job.</p></div>`})():""}
    <div class="actions" style="margin-bottom:12px"><span class="small num">Showing ${vs.length} of ${all.length} vendors</span>${on?`<button class="linkbtn" data-act="rclear">Clear filters</button>`:""}</div>`;
  if(!vs.length)return h+`<p class="small">No vendors match those filters.</p>`;
  return h+`<div class="tablewrap"><table><thead><tr><th>Vendor</th><th>Service</th><th>Areas</th><th>Rating</th><th>Pricing</th><th>Licensed and insured</th><th>Taking work</th><th>Booked</th><th></th></tr></thead><tbody>${vs.map(v=>`<tr>
    <td><button class="vlink strong" data-act="vcard" data-id="${esc(v.id)}">${esc(v.name)}</button>${vnotes(v.id).length?` <span class="small" title="You have notes on this vendor">· ${vnotes(v.id).length} ${vnotes(v.id).length===1?"note":"notes"}</span>`:""} ${v.approved===false?'<span class="pill late">Needs review</span>':""} ${v.featured?'<span class="pill featured">Featured</span>':""} ${v.sample?'<span class="pill example">Example</span>':""}${vPhone(v)||vEmail(v)?`<div class="small">${esc([vPhone(v),vEmail(v)].filter(Boolean).join(" · "))}</div>`:""}</td>
    <td>${esc(vsv(v).join(", "))}</td><td class="small" style="max-width:240px">${esc((v.areas||[]).join(", "))}</td><td>${ratingHtml(v.id)}${(()=>{const k=S.reviews.filter(r=>r.vendorId===v.id&&!r.approved).length;return k?`<div><button class="pill comparing" style="border:0;cursor:pointer;margin-top:4px" data-act="vcard" data-id="${esc(v.id)}">${k} to approve</button></div>`:""})()}</td>
    <td>${(()=>{const st=priceStats(v.id);return st?`${st.tier?tierPill(st):'<span class="small">Not enough bids yet</span>'}<div class="small num" style="margin-top:4px">Avg ${money(st.avgAmt)} · ${st.n} ${st.n===1?"bid":"bids"}${st.decided?` · won ${st.won} of ${st.decided}`:""}</div>`:'<span class="small">No bids yet</span>'})()}</td>
    <td>${v.licensed&&v.insured?"Yes":'<span style="color:var(--warn)">Check</span>'}</td>
    <td>${S.canWrite?`<button class="linkbtn" style="color:var(--ink);text-decoration:none" data-act="avail" data-id="${esc(v.id)}"><span class="dot ${v.available!==false?"on":""}"></span>${v.available!==false?"Yes":"Paused"}</button>`:v.available!==false?"Yes":"Paused"}</td>
    <td class="num">${S.bids.filter(b=>b.vendorId===v.id&&b.status==="selected").length}</td>
    <td>${S.canWrite?(v.approved===false?`<button class="btn sm" data-act="vcard" data-id="${esc(v.id)}">Review</button>`:`<button class="linkbtn" data-act="feature" data-id="${esc(v.id)}">${v.featured?"End promo":"Mark promo paid"}</button>`):""}</td></tr>`).join("")}</tbody></table></div>
    <p class="small">Gold "Featured" marks a vendor who paid for a promo. Ratings come from approved reviews and count toward matches. Pricing compares each vendor's bids to the other bids on the same job, and only you see it. When a project has a budget, vendors whose pricing fits it rank higher.</p>`;
}

function revItem(r,showVendor){const p=projById(r.projectId);const v=vendorById(r.vendorId);
  return `<div class="rev"><div class="top"><div>${showVendor?`<button class="vlink strong" data-act="vcard" data-id="${esc(r.vendorId)}">${esc(v?v.name:"Vendor")}</button> `:""}<span class="rating"><b>${"★".repeat(r.rating)}</b><span class="small">${"★".repeat(5-r.rating)}</span></span></div>
    ${r.approved?`<span class="pill set">Showing</span>`:`<span class="pill comparing">Needs approval</span>`}</div>
    ${r.comment?`<div>${esc(r.comment)}</div>`:""}<div class="small">${esc(r.agent||"Agent")} · ${esc(p?p.address:"")} · ${ago(r.createdAt)}</div>
    ${S.canWrite?`<div class="actions">${r.approved?`<button class="btn ghost sm" data-act="approve" data-id="${esc(r.id)}" data-v="0">Hide</button>`:`<button class="btn sm" data-act="approve" data-id="${esc(r.id)}" data-v="1">Approve</button>`}</div>`:""}</div>`}
function reviewQueue(){
  const pend=S.reviews.filter(r=>!r.approved).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  const n=S.reviews.length;
  let h=`<section class="revq"><div class="sechead"><div><h2>Reviews ${pend.length?`<span class="count">${pend.length}</span>`:""}</h2>
    <span class="small">${pend.length?"New reviews wait here for your approval before they count toward a vendor's rating.":n?"All caught up. Every vendor's reviews are on their card, so click a name to see them.":"Agents can review a vendor once a job is done or the home is listed. New ones show up here for your approval."}</span></div>
    ${n>pend.length?`<button class="linkbtn" data-act="allrevs">${S.allRevs?"Hide all reviews":"See all reviews ("+n+")"}</button>`:""}</div>`;
  const list=S.allRevs?[...pend,...S.reviews.filter(r=>r.approved).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))]:pend;
  if(list.length)h+=`<div class="revlist">${list.map(r=>revItem(r,true)).join("")}</div>`;
  return h+`</section>`;
}

function feeEstLine(b,amt){const ty=feeTypeFor(b),a=Number(amt)||0;if(!a)return"Enter your amount to see the estimate.";

/* ---------- writes ---------- */
async function guard(fn,ok){
  if(S.busy||!S.db)return;S.busy=true;
  try{await fn();if(ok)toast(typeof ok==="function"?ok():ok)}
  catch(e){
    if(e&&e.code==="invalid_argument"){S.canWrite=false;toast("You can view this page but not change it. Ask Ashleigh for Contributor access.")}
    else if(e&&e.code==="quota_exceeded")toast("Storage is full. Clear example data or old projects, then try again.");
    else toast((e&&e.message)||"That didn't save. Try again in a moment.");
    console.error(e);
  }finally{S.busy=false;render()}
}
async function uploadPdf(fd){
  const f=fd.get("pdf");if(!f||!f.size||!S.assets)return{};
  if(f.size>20*1024*1024)throw{message:"That file is over 20 MB. Compress it or take a smaller photo, then try again."};

const PROTO_KEY="orbyt-portal-proto-v1";
const BLOBS={};
function makeMockDb(){
  let data={};try{data=JSON.parse(localStorage.getItem(PROTO_KEY)||"{}")||{}}catch(e){data={}}
  const colL={},docL={};
  const save=()=>{try{localStorage.setItem(PROTO_KEY,JSON.stringify(data))}catch(e){}};
  const clone=x=>x==null?x:JSON.parse(JSON.stringify(x));
  const split=p=>{const i=p.lastIndexOf("/");return[p.slice(0,i),p.slice(i+1)]};
  const snapOf=c=>({docs:Object.entries(data[c]||{}).map(([id,d])=>({id,exists:true,data:()=>clone(d)}))});
  const docSnap=p=>{const[c,id]=split(p);const d=(data[c]||{})[id];return{id,exists:!!d,data:()=>clone(d)}};
  const notify=(c,p)=>setTimeout(()=>{(colL[c]||[]).forEach(fn=>fn(snapOf(c)));(docL[p]||[]).forEach(fn=>fn(docSnap(p)))},0);
  const ref=p=>{const[c,id]=split(p);return{id,
    set:async d=>{(data[c]=data[c]||{})[id]=clone(d);save();notify(c,p)},
    update:async d=>{const cur=(data[c]||{})[id];if(!cur)throw{message:"That item no longer exists."};Object.assign(cur,clone(d));save();notify(c,p)},
    delete:async()=>{if(data[c])delete data[c][id];save();notify(c,p)},
    onSnapshot:fn=>{(docL[p]=docL[p]||[]).push(fn);setTimeout(()=>fn(docSnap(p)),0);return()=>{}}}};
  return{
    collection:c=>({onSnapshot:fn=>{(colL[c]=colL[c]||[]).push(fn);setTimeout(()=>fn(snapOf(c)),0);return()=>{}},
      add:async d=>{const id="x"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);await ref(c+"/"+id).set(d);return{id}},
      doc:id=>ref(c+"/"+id)}),
    doc:ref,
    _has:c=>Object.keys(data[c]||{}).length>0,
    _reset:()=>{const cs=Object.keys(data);data={};save();cs.forEach(c=>notify(c,""));Object.keys(docL).forEach(p=>notify(split(p)[0],p))}};
}

  BLOBS[id]={url:URL.createObjectURL(file),type:file.type||"",name:file.name||"file"};return{id}}};

  return `<section class="teampanel"><div class="sechead"><div><h3>Shared with</h3><span class="small">Everyone here can see this project, its quotes and tasks, and act on them. Only the listing agent gets emails unless you turn them on for someone.</span></div>
    ${owner&&!open?`<button class="btn ghost sm" data-act="form" data-key="team:${esc(p.id)}">Share this project</button>`:""}</div>
    <ul class="teamlist"><li><div><span class="strong">${esc(p.agent)}</span> <span class="pill set">Listing agent</span>${me===p.agent?' <span class="small">(you)</span>':""}</div><span class="small">${esc(p.agentEmail||agentProfile(p.agent).email||"")}</span></li>
    ${ms.map((m,i)=>`<li><div><span class="strong">${esc(m.name)}</span> <span class="pill">${esc(m.role)}</span>${me&&m.name===me?' <span class="small">(you)</span>':""}</div>
      <span class="small">${esc(m.email)} · ${status(m)}${m.fromDefault?" · shared automatically":""} · ${owner?`<label class="inlinecheck"><input type="checkbox" id="tmn-${esc(p.id)}-${i}" data-tmnotify="${i}" data-p="${esc(p.id)}" ${m.notify?"checked":""}> Gets emails</label> · <button class="linkbtn" data-act="teamremove" data-id="${esc(p.id)}" data-i="${i}">Remove</button>`:(m.notify?"Gets emails":"No emails")}</span></li>`).join("")}</ul>
    ${open?`<form class="form" data-form="teamadd" data-id="${esc(p.id)}"><div class="grid">
      <label class="field"><span>Name</span><input type="text" id="tm-name-${esc(p.id)}" name="name" required placeholder="Alex Kim"></label>
      <label class="field"><span>Email</span><input type="email" id="tm-email-${esc(p.id)}" name="email" required placeholder="alex@brokerage.com"></label>
      <label class="field"><span>Role on this project</span><select id="tm-role-${esc(p.id)}" name="role">${TEAMROLES.map(r=>`<option>${r}</option>`).join("")}</select></label></div>
      <label class="checkrow"><input type="checkbox" id="tm-notify-${esc(p.id)}" name="notify"> Also send them Orbyt emails for this project</label>
      <p class="small" style="margin:0">They'll get an email invite either way. If they're new to Orbyt, they sign up and land right on this project, with no separate approval.</p>
      <div class="actions"><button class="btn sm" type="submit">Share</button><button class="btn ghost sm" type="button" data-act="cancel">Cancel</button></div></form>`:""}</section>`;
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
  if(a==="npeditcontact"){S.npEditContact=true;render()}
  else if(a==="newproject"||a==="cancel")S.npEditContact=false;
  else if(a==="teamremove"){const p=projById(t.dataset.id);if(!p)return;const ms=[...(p.members||[])],gone=ms.splice(+t.dataset.i,1)[0];
    guard(()=>S.db.doc("projects/"+p.id).update({members:ms}),(gone?gone.name:"They")+" no longer has access to this project")}},true);
document.addEventListener("submit",e=>{const f=e.target.closest('form[data-form="teamadd"]');if(!f)return;e.preventDefault();e.stopImmediatePropagation();
  const p=projById(f.dataset.id),fd=new FormData(f),name=String(fd.get("name")||"").trim(),email=String(fd.get("email")||"").trim().toLowerCase();
  if(!p)return;if(!name||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast("Add their name and a valid email.");return}
  if(String(p.agentEmail||"").toLowerCase()===email||(p.members||[]).some(m=>String(m.email).toLowerCase()===email)){toast("This project is already shared with them.");return}
  guard(async()=>{await S.db.doc("projects/"+p.id).update({members:[...(p.members||[]),{name,email,role:String(fd.get("role")),notify:!!fd.get("notify"),addedBy:kind()==="agent"?roleVal():"Ashleigh",addedAt:now()}]});S.openForm=null},"Shared with "+name+". They'll get an email invite.")},true);

/* ---------- default team (per agent) ---------- */
const teamKey=a=>"t-"+String(a||"").toLowerCase().replace(/[^a-z0-9]+/g,"-");
const defaultTeamOf=a=>((S.teams||{})[teamKey(a)]||{}).members||[];
function myTeamView(agent){
  const ms=defaultTeamOf(agent),open=S.openForm==="myteam";
  const active=S.projects.filter(p=>p.agent===agent&&!p.listed);
  const missing=active.filter(p=>ms.some(m=>!(p.members||[]).some(x=>String(x.email).toLowerCase()===String(m.email).toLowerCase())));
  return `<section class="section"><div class="sechead"><div><h2>Always share with</h2><span class="small">Every new project you start is shared with the people here, like a coordinator who works on all your listings. You can still change who's on any single project.</span></div>
    ${S.canWrite&&!open?`<button class="btn sm" data-act="form" data-key="myteam">Add someone</button>`:""}</div>
    ${open?myTeamForm():""}
    ${ms.length?`<ul class="teamlist">${ms.map((m,i)=>`<li><div><span class="strong">${esc(m.name)}</span> <span class="pill">${esc(m.role)}</span></div>
      <span class="small">${esc(m.email)} · <label class="inlinecheck"><input type="checkbox" id="dt-n-${i}" data-dtnotify="${i}" ${m.notify?"checked":""}> Gets Orbyt emails too</label> · <button class="linkbtn" data-act="dtremove" data-i="${i}">Remove</button></span></li>`).join("")}</ul>`
      :`<p class="small" style="margin:0">No one here yet. Add your coordinator, assistant or team partner once, and every new project is shared with them.</p>`}
    ${ms.length&&missing.length?`<div class="callout"><p style="margin:0">${missing.length} of your active ${missing.length===1?"project isn't":"projects aren't"} shared with everyone on this list yet.</p><div class="actions"><button class="btn ghost sm" data-act="dtapply">Share ${missing.length===1?"it":"them"} now</button></div></div>`:""}
  </section>`;
}
function myTeamForm(){
  return `<form class="form" data-form="myteamadd"><div class="grid">
    <label class="field"><span>Name</span><input type="text" id="dt-name" name="name" required placeholder="Sam Lee"></label>
    <label class="field"><span>Email</span><input type="email" id="dt-email" name="email" required placeholder="sam@brokerage.com"></label>
    <label class="field"><span>Role</span><select id="dt-role" name="role">${TEAMROLES.map(r=>`<option ${r==="Assistant or coordinator"?"selected":""}>${r}</option>`).join("")}</select></label></div>
    <label class="checkrow"><input type="checkbox" id="dt-notify" name="notify"> Also send them Orbyt emails (new quotes, confirmations, reminders)</label>
    <div class="actions"><button class="btn sm" type="submit">Add</button><button class="btn ghost sm" type="button" data-act="cancel">Cancel</button></div></form>`;
}
const saveTeam=(agent,members,msg)=>guard(()=>S.db.doc("teams/"+teamKey(agent)).set({agent,members}),msg);
function teamCheckboxForNew(agent){
  const ms=defaultTeamOf(agent);if(kind()!=="agent"||!ms.length)return"";
  return `<label class="checkrow"><input type="checkbox" id="np-useteam" name="useTeam" checked> Share with my usual people: ${esc(ms.map(m=>m.name+" ("+m.role.toLowerCase()+")").join(", "))}</label>`;
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t||kind()!=="agent")return;const a=t.dataset.act,agent=roleVal();
  if(a==="dtremove"){const ms=[...defaultTeamOf(agent)],g=ms.splice(+t.dataset.i,1)[0];saveTeam(agent,ms,"New projects won't be shared with "+(g?g.name:"them")+". Projects already shared with them stay shared until you change it there.")}
  else if(a==="dtapply"){const ms=defaultTeamOf(agent);guard(async()=>{let n=0;for(const p of S.projects.filter(p=>p.agent===agent&&!p.listed)){const cur=[...(p.members||[])];let changed=false;
      for(const m of ms)if(!cur.some(x=>String(x.email).toLowerCase()===String(m.email).toLowerCase())){cur.push({...m,addedBy:agent,addedAt:now(),fromDefault:true});changed=true}
      if(changed){n++;await S.db.doc("projects/"+p.id).update({members:cur})}}
    toast("Shared "+n+(n===1?" project":" projects"))})}},true);
document.addEventListener("change",e=>{const el=e.target;
  if(el.dataset&&el.dataset.dtnotify!==undefined&&kind()==="agent"){const agent=roleVal(),ms=defaultTeamOf(agent).map((m,i)=>i===+el.dataset.dtnotify?{...m,notify:el.checked}:m);saveTeam(agent,ms,el.checked?"They'll get Orbyt emails on new projects":"Emails off for new projects")}
  if(el.dataset&&el.dataset.tmnotify!==undefined){const p=projById(el.dataset.p);if(!p)return;const ms=(p.members||[]).map((m,i)=>i===+el.dataset.tmnotify?{...m,notify:el.checked}:m);
    guard(()=>S.db.doc("projects/"+p.id).update({members:ms}),el.checked?"They'll get emails for this project":"Emails off for them on this project")}});
document.addEventListener("submit",e=>{const f=e.target.closest('form[data-form="myteamadd"]');if(!f)return;e.preventDefault();e.stopImmediatePropagation();
  const agent=roleVal(),fd=new FormData(f),name=String(fd.get("name")||"").trim(),email=String(fd.get("email")||"").trim().toLowerCase();
  if(!name||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast("Add their name and a valid email.");return}
  if(defaultTeamOf(agent).some(m=>String(m.email).toLowerCase()===email)){toast("They're already on your list.");return}
  S.openForm=null;saveTeam(agent,[...defaultTeamOf(agent),{name,email,role:String(fd.get("role")),notify:!!fd.get("notify")}],"Every new project you start will be shared with "+name+".")},true);

/* ---------- boot ---------- */
render();
(async()=>{
  const db=makeMockDb();S.db=db;S.assets=mockAssets;S.downloads=null;S.canWrite=true;
  db.collection("teams").onSnapshot(snap=>{S.teams={};snap.docs.forEach(d=>S.teams[d.id]=d.data());schedule()});
  db.collection("signups").onSnapshot(snap=>{S.signups=snap.docs.map(d=>({id:d.id,...d.data()}));schedule()});
  db.collection("markets").onSnapshot(snap=>{S.markets=snap.docs.map(d=>({id:d.id,...d.data()}));schedule()},err=>console.error(err));
  for(const side of ["agents","vendors"])db.collection("private/contacts/"+side).onSnapshot(snap=>{S.contacts={...S.contacts,[side]:snap.docs.map(d=>({id:d.id,...d.data()}))};schedule()},err=>console.error(err));
  db.collection("private/timelog/entries").onSnapshot(snap=>{S.timelog=snap.docs.map(d=>({id:d.id,...d.data()}));schedule()},err=>console.error(err));
  db.collection("private/spend/entries").onSnapshot(snap=>{S.spend=snap.docs.map(d=>({id:d.id,...d.data()}));schedule()},err=>console.error(err));
  db.doc("private/config").onSnapshot(d=>{S.config=d.exists?d.data():{};schedule()},err=>console.error(err));
  db.collection("private/notes/vendors").onSnapshot(snap=>{S.vnotes={};snap.docs.forEach(d=>S.vnotes[d.id]=d.data());schedule()},err=>console.error(err));
  for(const n of ["vendors","projects","bids","reviews","mytasks","taskstate","favorites","settings"])db.collection(n).onSnapshot(snap=>{
    if(n==="taskstate"||n==="favorites"||n==="settings"){S[n]={};snap.docs.forEach(d=>S[n][d.id]=d.data())}else S[n]=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(n==="vendors")S.vendors.forEach(v=>{v.areas=normAreas(v.areas)});
    if(n==="projects")S.projects.forEach(p=>{p.area=normArea(p.area)});
    S.loaded[n]=true;schedule();
  },err=>{console.error(err);if(err.code==="revoked"){S.canWrite=false;S.dbMissing=true;render()}});
  if(!db._has("vendors"))await seedPrototype();
})();
</script>
